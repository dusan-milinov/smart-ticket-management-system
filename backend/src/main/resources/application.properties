spring.application.name=backend

app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.password=${APP_SEED_PASSWORD:}

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

security.jwt.secret=${SECRET_KEY}
security.jwt.expiration-seconds = 1800
security.jwt.cookie-name=access_token
# Must be true in production (HTTPS). Browsers accept Secure cookies on http://localhost too.
security.jwt.cookie-secure=false

app.cors.allowed-origins=http://localhost:4200

#springdoc.swagger-ui.enabled=false
