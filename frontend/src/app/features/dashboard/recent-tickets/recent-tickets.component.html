<div class="recent-card" role="list" aria-label="Recent tickets">
  @for (ticket of tickets(); track ticket.ticketId) {
    <article class="ticket-row" role="listitem">
      <div class="ticket-summary">
        <span class="ticket-title" [title]="ticket.title">{{ ticket.title }}</span>
        <span class="ticket-number">{{ ticket.ticketNumber }}</span>
      </div>
      <div class="ticket-meta">
        <span class="badge status-{{ ticket.ticketStatus.toLowerCase() }}">{{ label(ticket.ticketStatus) }}</span>
        <span class="badge priority-{{ ticket.ticketPriority.toLowerCase() }}">{{ label(ticket.ticketPriority) }}</span>
      </div>
      <time class="ticket-date" [attr.datetime]="ticket.createdAt">{{ ticket.createdAt | date: 'MMM d, y' }}</time>
      <a class="btn ticket-view" [routerLink]="['/tickets', ticket.ticketId]"
        [queryParams]="returnTo() ? { returnTo: returnTo() } : null"
        [attr.aria-label]="'View ticket ' + ticket.ticketNumber">View</a>
    </article>
  }
</div>
